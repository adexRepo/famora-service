spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:60MB}
  datasource:
    driverClassName: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=famora}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      minimum-idle: ${DB_HIKARI_MINIMUM_IDLE:1}
      maximum-pool-size: ${DB_HIKARI_MAXIMUM_POOL_SIZE:5}
      idleTimeout: ${DB_HIKARI_IDLE_TIMEOUT:30000}
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: famora
        format_sql: ${JPA_FORMAT_SQL:false}
        show_sql: ${JPA_SHOW_SQL:false}
  moduli:
    events:
      jdbc-schema-initialization:
        enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true

server:
  port: ${SERVER_PORT:8061}
  servlet:
    context-path: /famora
  # Enable FRAMEWORK only behind a trusted proxy that strips client-supplied forwarding headers.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:NONE}
  error:
    include-exception: ${SERVER_ERROR_INCLUDE_EXCEPTION:false}
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:never}
    include-stacktrace: ${SERVER_ERROR_INCLUDE_STACKTRACE:never}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}
    com.famora: ${LOG_LEVEL_SVC:INFO}
    org.flywaydb.core: ${LOG_LEVEL_FLYWAY:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}

app:
  namespace:
    environment: ${APP_ENV:local}
  cache:
    redis:
      enabled: ${REDIS_CACHE_ENABLED:false}
      finance-dashboard-ttl: ${REDIS_FINANCE_DASHBOARD_TTL:2m}
      business-summary-ttl: ${REDIS_BUSINESS_SUMMARY_TTL:3m}
  account-deletion:
    support-email: ${ACCOUNT_DELETION_SUPPORT_EMAIL:}
  print-stack-trace:
    enabled: ${ENABLED_PRINT_STACKTRACE:false}
  async:
    thread:
      core-pool-size: ${ASYNC_THREAD_CORE_POOL_SIZE:5}
      max-pool-size: ${ASYNC_THREAD_MAX_POOL_SIZE:10}
      queue-capacity: ${ASYNC_THREAD_QUEUE_CAPACITY:20}
  vault:
    encryption-key: ${VAULT_ENCRYPTION_KEY:Zo7rYK1Yei9YrmpD5UoS3V1ZpWFlICL7cHqL6H8kgxE=}
    previous-encryption-keys: ${VAULT_PREVIOUS_ENCRYPTION_KEYS:}
    rotation-cron: ${VAULT_ROTATION_CRON:0 */5 * * * *}
  security:
    session-cleanup-cron: ${SESSION_CLEANUP_CRON:0 17 3 * * *}
    websocket-ticket-cleanup-cron: ${WEBSOCKET_TICKET_CLEANUP_CRON:0 */10 * * * *}
    rate-limit-cleanup-cron: ${RATE_LIMIT_CLEANUP_CRON:0 43 3 * * *}
    rate-limit:
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
      login-attempts: ${RATE_LIMIT_LOGIN_ATTEMPTS:5}
      registration-attempts: ${RATE_LIMIT_REGISTRATION_ATTEMPTS:3}
      refresh-attempts: ${RATE_LIMIT_REFRESH_ATTEMPTS:10}
      invitation-join-attempts: ${RATE_LIMIT_INVITATION_JOIN_ATTEMPTS:10}
      websocket-ticket-attempts: ${RATE_LIMIT_WEBSOCKET_TICKET_ATTEMPTS:30}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    jwt:
      issuer: ${JWT_ISSUER:famoraApp}
      # Public development fallback for local startup only. Always set JWT_SECRET outside local development.
      secret: ${JWT_SECRET:ZmFtb3JhLWxvY2FsLWRldmVsb3BtZW50LWp3dC1rZXktZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9u}
      access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINS:30}
      refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}
  currency:
    base-currency: USD
    supported-currencies:
      - USD
      - MYR
      - IDR
      - JPY
    frankfurter-url: https://api.frankfurter.dev/v1/latest
    refresh-hours: 5
  prayer-times:
    aladhan-base-url: ${PRAYER_TIMES_ALADHAN_BASE_URL:https://api.aladhan.com/v1}
    default-method: ${PRAYER_TIMES_DEFAULT_METHOD:20}
    default-school: ${PRAYER_TIMES_DEFAULT_SCHOOL:0}
    cache-hours: ${PRAYER_TIMES_CACHE_HOURS:24}
  family:
    max-active-family-per-user: ${FAMILY_MAX_ACTIVE_PER_USER:3}
  storage:
    type: ${STORAGE_TYPE:MINIO}
    root: ${STORAGE_ROOT:/app/storage}
    max-upload-bytes: ${STORAGE_MAX_UPLOAD_BYTES:104857600}
    document-max-upload-bytes: ${DOCUMENT_MAX_UPLOAD_BYTES:52428800}
    daily-report-photo-max-upload-bytes: ${DAILY_REPORT_PHOTO_MAX_UPLOAD_BYTES:10485760}
  backup:
    temp-root: ${BACKUP_TEMP_ROOT:}
    max-chunk-bytes: ${BACKUP_MAX_CHUNK_BYTES:5242880}
    max-file-bytes: ${BACKUP_MAX_FILE_BYTES:52428800}
    quota:
      default-bytes: ${BACKUP_DEFAULT_QUOTA_BYTES:10737418240}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket: ${MINIO_BUCKET:${APP_ENV:local}-famora}
